<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1738" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <!-- Key top gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3860" />
      <stop offset="100%" stop-color="#0e142e" />
    </linearGradient>
    
    <!-- Neon letter gradients -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff60b0" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#70f5ff" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffd570" />
    </linearGradient>
    
    <!-- Finger/hand skin gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd4b2" />
      <stop offset="100%" stop-color="#ffb38a" />
    </linearGradient>

    <!-- Glow/Shadow filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Glow effects behind key -->
  <circle cx="256" cy="270" r="140" fill="#00f0ff" opacity="0.1" filter="url(#neonGlow)"/>
  <circle cx="180" cy="180" r="120" fill="#ff007f" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Main Keyboard Key (3D child key style) -->
  <g filter="url(#shadowFilter)">
    <rect x="96" y="180" width="320" height="240" rx="44" fill="url(#keyGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
    <!-- Key top surface inner bezel -->
    <rect x="112" y="196" width="288" height="190" rx="32" fill="#151d3b" opacity="0.8"/>
  </g>

  <!-- Child's Tapping Hand & Finger -->
  <g transform="translate(200, 110)">
    <!-- Arm extension -->
    <path d="M 50 280 Q 110 240 85 100 C 65 30 10 -15 -20 10 Q -55 45 -20 130 Z" fill="url(#skinGrad)" filter="url(#shadowFilter)"/>
    <!-- Friendly fingernail -->
    <path d="M -10 12 Q -2 -5 12 -1 Q 25 8 16 26 Q -6 34 -10 12 Z" fill="#fff" opacity="0.55"/>
    <!-- Sparkle at tapping contact point -->
    <path d="M -30 115 L -20 130 L -5 135 L -20 145 L -30 165 L -40 145 L -55 135 L -40 130 Z" fill="#ffd570" filter="url(#neonGlow)"/>
  </g>

  <!-- Floating Magical Neon Arabic Letters -->
  <!-- 'أ' soaring top-right -->
  <g transform="translate(390, 140) scale(3.5)" filter="url(#neonGlow)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" fill="url(#neonPink)" text-anchor="middle">أ</text>
  </g>
  <!-- 'ب' soaring top-left -->
  <g transform="translate(120, 150) scale(3.0) rotate(-15)" filter="url(#neonGlow)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" fill="url(#neonCyan)" text-anchor="middle">ب</text>
  </g>
  <!-- 'ت' soaring center-top -->
  <g transform="translate(250, 95) scale(2.6) rotate(10)" filter="url(#neonGlow)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" fill="url(#neonGold)" text-anchor="middle">ت</text>
  </g>

  <!-- Sparkles & Stars in background -->
  <path d="M 430 220 L 436 232 L 448 236 L 436 240 L 430 252 L 424 240 L 412 236 L 424 232 Z" fill="#ffd570" filter="url(#neonGlow)" opacity="0.95"/>
  <path d="M 80 260 L 85 270 L 95 273 L 85 276 L 80 286 L 75 276 L 65 273 L 75 270 Z" fill="#00f0ff" filter="url(#neonGlow)" opacity="0.95"/>
  <circle cx="280" cy="150" r="10" fill="#fff" opacity="0.8"/>
  <circle cx="160" cy="220" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="360" cy="250" r="8" fill="#fff" opacity="0.8"/>
</svg>
