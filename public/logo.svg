<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Key top gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3860" />
      <stop offset="100%" stop-color="#0e142e" />
    </linearGradient>
    
    <!-- Neon letter gradients -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff60b0" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#70f5ff" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffd570" />
    </linearGradient>
    
    <!-- Finger/hand skin gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd4b2" />
      <stop offset="100%" stop-color="#ffb38a" />
    </linearGradient>

    <!-- Glow/Shadow filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ICON GROUP (x: 5 to 95) -->
  <g transform="translate(10, 5)">
    <!-- Base Glow Behind the Key -->
    <circle cx="45" cy="45" r="35" fill="#00f0ff" opacity="0.12" filter="url(#neonGlow)"/>
    <circle cx="35" cy="30" r="25" fill="#ff007f" opacity="0.1" filter="url(#neonGlow)"/>

    <!-- Keyboard Key (tapped state / flat perspective) -->
    <rect x="10" y="25" width="70" height="55" rx="16" fill="url(#keyGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" filter="url(#shadowFilter)"/>
    <!-- Key Inner surface -->
    <rect x="14" y="29" width="62" height="43" rx="12" fill="#151d3b" opacity="0.8"/>
    
    <!-- Child's Tapping Finger -->
    <g transform="translate(36, 12)">
      <!-- Arm/Hand extension -->
      <path d="M 12 60 Q 25 50 18 20 C 14 5 2 -5 -4 2 Q -12 10 -4 28 Z" fill="url(#skinGrad)" filter="url(#shadowFilter)"/>
      <!-- Soft child fingernail -->
      <path d="M -2 3 Q 0 -1 3 0 Q 6 2 4 6 Q -1 8 -2 3 Z" fill="#fff" opacity="0.5"/>
      <!-- Sparkle at point of contact -->
      <path d="M -8 24 L -6 28 L -2 29 L -6 31 L -8 35 L -10 31 L -14 29 L -10 28 Z" fill="#ffd570" filter="url(#neonGlow)"/>
    </g>

    <!-- Floating Magical Arabic Letters -->
    <!-- 'أ' rising top-right -->
    <g transform="translate(68, 20) scale(0.95)" filter="url(#neonGlow)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#neonPink)" text-anchor="middle">أ</text>
    </g>
    <!-- 'ب' rising top-left -->
    <g transform="translate(20, 24) scale(0.85) rotate(-15)" filter="url(#neonGlow)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="url(#neonCyan)" text-anchor="middle">ب</text>
    </g>
    <!-- 'ت' rising center-top -->
    <g transform="translate(42, 12) scale(0.75) rotate(10)" filter="url(#neonGlow)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="url(#neonGold)" text-anchor="middle">ت</text>
    </g>

    <!-- Sparkles -->
    <path d="M 75 32 L 77 35 L 80 36 L 77 37 L 75 40 L 73 37 L 70 36 L 73 35 Z" fill="#ffd570" opacity="0.9"/>
    <path d="M 12 36 L 14 38 L 17 39 L 14 40 L 12 42 L 10 40 L 7 39 L 10 38 Z" fill="#00f0ff" opacity="0.9"/>
    <circle cx="50" cy="25" r="2.5" fill="#fff" opacity="0.8"/>
    <circle cx="30" cy="38" r="1.5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- TEXT GROUP (x: 110 onwards) -->
  <g transform="translate(102, 32)">
    <!-- Brand Title: Arab Fingers -->
    <text x="0" y="24" font-family="Fredoka, system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="0.5" filter="url(#shadowFilter)">
      <tspan fill="#FFFFFF">Arab </tspan>
      <tspan fill="#9fe1cb">Fingers</tspan>
    </text>
    
    <!-- Cute Bilingual Tagline -->
    <text x="2" y="47" font-family="Fredoka, system-ui, sans-serif" font-weight="500" font-size="13.5" fill="rgba(255, 255, 255, 0.48)" letter-spacing="1">
      PLAY &amp; LEARN ARABIC • إلمس وتعلم
    </text>
  </g>
</svg>
