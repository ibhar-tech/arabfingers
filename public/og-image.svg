<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0a1331"/>
      <stop offset="100%" stop-color="#03040d"/>
    </linearGradient>

    <!-- Key top gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3860" />
      <stop offset="100%" stop-color="#0e142e" />
    </linearGradient>
    
    <!-- Neon gradients -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff60b0" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#70f5ff" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffd570" />
    </linearGradient>
    
    <!-- Skin gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd4b2" />
      <stop offset="100%" stop-color="#ffb38a" />
    </linearGradient>

    <!-- Glow/Shadow filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative Atmospheric Glowing Rings -->
  <circle cx="150" cy="315" r="280" fill="none" stroke="#9fe1cb" stroke-width="6" opacity="0.08" filter="url(#neonGlow)"/>
  <circle cx="1050" cy="315" r="200" fill="none" stroke="#ff007f" stroke-width="4" opacity="0.06" filter="url(#neonGlow)"/>

  <!-- Center Decorative Sparkles -->
  <g opacity="0.45">
    <path d="M 600 60 L 603 72 L 615 75 L 603 78 L 600 90 L 597 78 L 585 75 L 597 72 Z" fill="#ffd570" filter="url(#neonGlow)"/>
    <path d="M 250 500 L 252 508 L 260 510 L 252 512 L 250 520 L 248 512 L 240 510 L 248 508 Z" fill="#00f0ff" filter="url(#neonGlow)"/>
    <circle cx="950" cy="120" r="8" fill="#fff"/>
    <circle cx="180" cy="140" r="5" fill="#fff"/>
  </g>

  <!-- BRAND IDENTITY GROUP (Center Horizontal Layout) -->
  <g transform="translate(180, 110)">
    
    <!-- ICON GRAPHIC (Left side of OG Card) -->
    <g transform="translate(0, 30)">
      <circle cx="110" cy="110" r="100" fill="#00f0ff" opacity="0.14" filter="url(#neonGlow)"/>
      <circle cx="80" cy="80" r="80" fill="#ff007f" opacity="0.1" filter="url(#neonGlow)"/>

      <!-- Keyboard Key -->
      <g filter="url(#shadowFilter)">
        <rect x="10" y="50" width="200" height="150" rx="34" fill="url(#keyGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
        <rect x="20" y="60" width="180" height="118" rx="24" fill="#151d3b" opacity="0.8"/>
      </g>

      <!-- Child Tapping Finger -->
      <g transform="translate(75, 5)">
        <path d="M 30 180 Q 75 155 58 70 C 45 25 10 -10 -10 8 Q -30 28 -10 85 Z" fill="url(#skinGrad)" filter="url(#shadowFilter)"/>
        <path d="M -4 8 Q 1 -4 10 -1 Q 18 4 13 16 Q -2 21 -4 8 Z" fill="#fff" opacity="0.5"/>
        <path d="M -15 72 L -8 82 L 2 85 L -8 92 L -15 105 L -22 92 L -32 85 L -22 82 Z" fill="#ffd570" filter="url(#neonGlow)"/>
      </g>

      <!-- Rising Neon Arabic Letters -->
      <g transform="translate(195, 30) scale(2.2)" filter="url(#neonGlow)">
        <text x="0" y="0" font-family="sans-serif" font-weight="900" fill="url(#neonPink)" text-anchor="middle">أ</text>
      </g>
      <g transform="translate(30, 35) scale(1.8) rotate(-15)" filter="url(#neonGlow)">
        <text x="0" y="0" font-family="sans-serif" font-weight="900" fill="url(#neonCyan)" text-anchor="middle">ب</text>
      </g>
      <g transform="translate(115, 0) scale(1.6) rotate(10)" filter="url(#neonGlow)">
        <text x="0" y="0" font-family="sans-serif" font-weight="900" fill="url(#neonGold)" text-anchor="middle">ت</text>
      </g>
    </g>

    <!-- WRITTEN CONTENT (Right side of OG Card) -->
    <g transform="translate(300, 70)">
      <!-- Giant Brand Header -->
      <text x="0" y="30" font-family="sans-serif" font-weight="800" font-size="94" letter-spacing="0.5" filter="url(#shadowFilter)">
        <tspan fill="#FFFFFF">Arab </tspan>
        <tspan fill="#9fe1cb">Fingers</tspan>
      </text>

      <!-- Subtitle/Translation Tagline -->
      <text x="5" y="90" font-family="sans-serif" font-weight="700" font-size="28" fill="rgba(255,255,255,0.65)" letter-spacing="1">
        Arabic Keyboard Smash Toy for Kids | لعبة الحروف العربية للأطفال
      </text>

      <!-- Core Features Badges Grid -->
      <g transform="translate(5, 154)" font-family="sans-serif" font-weight="600" font-size="21.5" fill="#FAC775">
        <text x="0" y="0">🚀 3D Animations</text>
        <text x="210" y="0">🔊 Audio Pronunciation</text>
        <text x="490" y="0">🎨 5 Kid Themes</text>
        <text x="0" y="42" fill="#9fe1cb">🛡️ 100% Kid Safe</text>
        <text x="210" y="42" fill="#9fe1cb">🌍 Bilingual English / Arabic</text>
        <text x="550" y="42" fill="#9fe1cb">📲 PWA Offline</text>
      </g>
    </g>

  </g>

  <!-- Giant Arabic Letter Background Accents (Very Soft) -->
  <text x="80" y="180" font-family="sans-serif" font-weight="900" font-size="120" fill="#ff007f" opacity="0.04" filter="url(#neonGlow)">أ</text>
  <text x="1060" y="480" font-family="sans-serif" font-weight="900" font-size="110" fill="#00f0ff" opacity="0.04" filter="url(#neonGlow)">ب</text>
</svg>
